plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

// Identificador de build para saber, desde dentro de la app, exactamente qué commit corre cada
// teléfono (ver DeviceInfo.kt / pantalla Diagnóstico). GITHUB_SHA y GITHUB_RUN_NUMBER ya los
// expone GitHub Actions automáticamente en cada corrida, sin tocar build.yml. Si se compila
// fuera de Actions (ej. Android Studio local) cae al SHA real de git en el checkout local, y si
// tampoco hay repo git disponible, a "local". Calculado aquí (nivel de script, no dentro de
// defaultConfig) porque exec() dentro de un bloque DSL anidado de Android no siempre resuelve
// correctamente contra el Project.
def gitShaForBuild = (System.getenv("GITHUB_SHA") ?: "").take(7)
if (gitShaForBuild.isEmpty()) {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            standardOutput = out
            ignoreExitValue = true
        }
        gitShaForBuild = out.toString().trim()
    } catch (ignored) { }
}
if (gitShaForBuild.isEmpty()) gitShaForBuild = "local"
def buildNumberForBuild = System.getenv("GITHUB_RUN_NUMBER") ?: "0"

android {
    namespace 'com.example.matrizapp'
    compileSdk 34
    defaultConfig {
        applicationId "com.example.matrizapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: project.findProperty("MAPS_API_KEY") ?: "PENDIENTE_CONFIGURAR"]
        buildConfigField "String", "BUILD_SHA", "\"${gitShaForBuild}\""
        buildConfigField "String", "BUILD_NUMBER", "\"${buildNumberForBuild}\""
    }
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.1' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    packagingOptions {
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt'] }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.compose.ui:ui:1.5.4'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.material:material-icons-extended:1.5.4'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    implementation('com.google.api-client:google-api-client-android:2.2.0') {
        exclude group: 'org.apache.httpcomponents'
    }
    implementation 'com.google.apis:google-api-services-sheets:v4-rev20230815-2.0.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0'
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    implementation 'com.google.maps.android:maps-compose:2.11.4'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.zxing:core:3.5.3'

    // Firebase BoM: mantiene compatibles las versiones de los SDK de Firebase.
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}
