name: Room migration test (emulator)

# Prueba de migración Room 37 -> 38 con MigrationTestHelper en emulador, SEPARADA del build/publicación del APK:
# un emulador inestable ya no impide publicar el APK.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/room-ci-emulador'
    paths:
      - '.github/workflows/room-migration-test.yml'
      - 'ci-scripts/**'
      - 'app/src/androidTest/**'
      - 'app/schemas/**'
      - 'app/src/main/java/com/example/matrizapp/AppDatabase.kt'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: room-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  room-migration:
    # Fijado a propósito: "ubuntu-latest" empezó a migrar a Ubuntu 26 el 19-oct-2026 (aviso en los runs).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnóstico del runner
        run: |
          mkdir -p diag
          {
            cat /etc/os-release | head -4
            echo "nproc: $(nproc)"; free -m | head -2
            ls -l /dev/kvm 2>&1 || true
            echo "usuario: $(id)"
          } | tee diag/runner.txt

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee -a diag/runner.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Recuperar snapshot Room 37 auténtico
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: bancoaztecabancoazteca101-lang/app-cobranza
          run_id: 40543083998
          name: room-schema-v37-b19c7fec1fac364b129d439c83cedeade2e0cac2
          path: /tmp/room-schema-v37
          if_no_artifact_found: fail

      - name: Generar el esquema Room 38 desde el código actual
        # app/schemas no está versionado: 38.json lo genera Room al compilar (exportSchema = true).
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Instalar snapshots Room 37 y 38 en los assets de androidTest
        run: |
          set -eu
          SCHEMA_DIR="com.example.matrizapp.AppDatabase"
          mkdir -p "app/schemas/$SCHEMA_DIR" "app/src/androidTest/assets/$SCHEMA_DIR"
          cp "/tmp/room-schema-v37/$SCHEMA_DIR/37.json" "app/schemas/$SCHEMA_DIR/37.json"
          test -s "app/schemas/$SCHEMA_DIR/37.json"
          test -s "app/schemas/$SCHEMA_DIR/38.json"
          cp "app/schemas/$SCHEMA_DIR/37.json" "app/src/androidTest/assets/$SCHEMA_DIR/37.json"
          cp "app/schemas/$SCHEMA_DIR/38.json" "app/src/androidTest/assets/$SCHEMA_DIR/38.json"

      - name: Probar migración Room 37 a 38 en emulador
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci-scripts/run-room-test.sh

      - name: Publicar diagnóstico (siempre)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash ci-scripts/publicar-diagnostico.sh

      - name: Guardar evidencia completa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-migration-diag-${{ github.run_number }}
          path: diag/
          if-no-files-found: warn
          retention-days: 14
