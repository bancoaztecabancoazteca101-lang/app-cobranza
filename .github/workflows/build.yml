name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace > build_output.log 2>&1 || (echo "BUILD_FAILED=true" >> $GITHUB_ENV; true)
        continue-on-error: false

      - name: Show log tail
        if: always()
        run: tail -n 400 build_output.log || true

      - name: Report failure as Issue
        if: env.BUILD_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/report_failure.py
      - name: Fail job if build failed
        if: env.BUILD_FAILED == 'true'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: env.BUILD_FAILED != 'true'
        with:
          name: MatrizApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish stable release with APK
        if: env.BUILD_FAILED != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Última build (debug)"
          body: "APK generado automáticamente desde el commit ${{ github.sha }}. Este link nunca cambia; siempre apunta a la ultima build exitosa."
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
