name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'chatgpt/**'
      - 'claude/**'
      - 'Backup'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          # main publica SOLO la build release (sin R8, probada) como app-debug.apk (el enlace de siempre).
          # La variante "optimizado" hoy es idéntica a release (R8 apagado), así que no se compila en main.
          # Las ramas publican las tres para poder comparar.
          TASKS="assembleRelease"
          if [ "${{ github.ref_name }}" != "main" ]; then TASKS="assembleDebug assembleRelease assembleOptimizado"; fi
          gradle $TASKS --stacktrace > build_output.log 2>&1 || (echo "BUILD_FAILED=true" >> $GITHUB_ENV; true)
        continue-on-error: false

      # En main: el APK release (sin R8) se publica con el nombre de siempre (app-debug.apk) para que el
      # enlace permanente latest-debug siga funcionando.
      - name: APK release con el nombre de siempre (solo main)
        if: env.BUILD_FAILED != 'true' && github.ref_name == 'main'
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f app/build/outputs/apk/release/app-release.apk

      - name: Show compiler errors
        if: always()
        run: |
          echo "===== ERRORES DEL COMPILADOR ====="
          grep -n -E '(^| )e: |error:|Unresolved reference|Type mismatch|Expecting|Cannot access|Compilation error' build_output.log | tail -n 120 || true
          echo "===== FIN ERRORES ====="
          echo "===== COLA DEL LOG ====="
          tail -n 250 build_output.log || true

      - name: Report failure as Issue
        if: env.BUILD_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/report_failure.py
      - name: Fail job if build failed
        if: env.BUILD_FAILED == 'true'
        run: exit 1

      - name: Compute release tag
        if: env.BUILD_FAILED != 'true' && github.event_name != 'pull_request'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "RELEASE_TAG=latest-debug" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=latest-debug-${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Publish stable release with APK
        if: env.BUILD_FAILED != 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Última build (debug) - ${{ github.ref_name }}"
          body: "APK generado automáticamente desde el commit ${{ github.sha }}."
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/optimizado/*.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
